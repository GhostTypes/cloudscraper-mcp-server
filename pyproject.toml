[project]
name = "cloudscraper-mcp-server"
version = "0.1.0"
description = "MCP Server for CloudScraper - Bypass Cloudflare restrictions for LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==3.0.0b1",
    "cloudscraper>=1.2.71",
    "brotli>=1.0.9",
    "beautifulsoup4>=4.10.0",
    "markdownify>=0.11.6",
    "tiktoken>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.14",
]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
    "PERF",   # perflint (performance)
    "RET",    # flake8-return
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
    # Security rule exceptions for scraping tool
    "S101",   # allow assert (used in tests)
    "S113",   # allow requests without timeout (user-controlled)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG001",  # Allow unused arguments in tests
    "S101",    # Allow assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "cloudflare: marks tests that hit Cloudflare-protected URLs",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
